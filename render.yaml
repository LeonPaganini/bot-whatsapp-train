services:
  - type: web
    name: treino-whatsapp-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    rootDir: backend
    envVars:
      - key: ENV
        value: prod
      - key: BASE_URL
        value: https://treino-whatsapp-backend.onrender.com
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: treino-whatsapp-frontend
    env: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    envVars:
      - key: API_BASE
        value: https://treino-whatsapp-backend.onrender.com
